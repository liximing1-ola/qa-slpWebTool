<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}表单{% endblock %}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .form-container {
            background: #fff;
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }

        .form-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .form-header h2 {
            color: #333;
            font-size: 1.5rem;
            margin-bottom: 8px;
        }

        .form-header p {
            color: #666;
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 0.95rem;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-group input[type="text"]::placeholder {
            color: #aaa;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-back {
            display: inline-block;
            margin-top: 20px;
            color: #667eea;
            text-decoration: none;
            font-size: 0.9rem;
        }

        .btn-back:hover {
            text-decoration: underline;
        }

        /* Toast 提示样式 */
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            padding: 16px 32px;
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
            font-weight: 500;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 1000;
            min-width: 280px;
            text-align: center;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        .toast.success {
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
        }

        .toast.error {
            background: linear-gradient(135deg, #dc3545 0%, #fd7e14 100%);
        }

        .toast.loading {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .info-box {
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            padding: 15px;
            margin-top: 20px;
            border-radius: 0 8px 8px 0;
        }

        .info-box h4 {
            color: #333;
            margin-bottom: 10px;
            font-size: 0.95rem;
        }

        .info-box table {
            width: 100%;
            font-size: 0.85rem;
            border-collapse: collapse;
        }

        .info-box th,
        .info-box td {
            padding: 8px;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;
        }

        .info-box th {
            color: #667eea;
            font-weight: 600;
        }

        .required::after {
            content: " *";
            color: #e74c3c;
        }

        @media (max-width: 480px) {
            .form-container {
                padding: 25px;
            }
            .form-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <div class="form-container">
        <div class="form-header">
            <h2>{% block form_title %}{% endblock %}</h2>
            <p>{% block form_desc %}{% endblock %}</p>
        </div>

        <form method="post">
            {% block form_content %}{% endblock %}

            <button type="submit" class="btn-submit">{% block submit_text %}确定{% endblock %}</button>
        </form>

        {% block extra_content %}{% endblock %}

        <a href="/qatest2023/" class="btn-back">← 返回首页</a>
    </div>

    <!-- Toast 容器 -->
    <div id="toast" class="toast"></div>

    <!-- 表单 AJAX 提交脚本 -->
    <script>
        (function() {
            const form = document.querySelector('form');
            const toast = document.getElementById('toast');
            const submitBtn = form.querySelector('button[type="submit"]');
            const originalBtnText = submitBtn.textContent;

            function showToast(message, type) {
                toast.textContent = message;
                toast.className = 'toast ' + type;
                setTimeout(() => toast.classList.add('show'), 10);

                if (type !== 'loading') {
                    setTimeout(() => {
                        toast.classList.remove('show');
                    }, 3000);
                }
            }

            function hideToast() {
                toast.classList.remove('show');
            }

            form.addEventListener('submit', function(e) {
                e.preventDefault();

                const formData = new FormData(form);

                // 显示加载状态
                submitBtn.disabled = true;
                submitBtn.textContent = '提交中...';
                showToast('正在提交...', 'loading');

                fetch(window.location.href, {
                    method: 'POST',
                    body: formData,
                    headers: {
                        'X-Requested-With': 'XMLHttpRequest'
                    }
                })
                .then(response => response.json())
                .then(data => {
                    hideToast();
                    if (data.success) {
                        showToast(data.message || '操作成功', 'success');
                        form.reset();
                    } else {
                        showToast(data.message || '操作失败', 'error');
                    }
                })
                .catch(error => {
                    hideToast();
                    showToast('请求失败，请稍后重试', 'error');
                    console.error('Error:', error);
                })
                .finally(() => {
                    submitBtn.disabled = false;
                    submitBtn.textContent = originalBtnText;
                });
            });
        })();
    </script>

    {% block extra_js %}{% endblock %}
</body>
</html>
