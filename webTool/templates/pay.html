{% extends "base_form.html" %}

{% block title %}模拟充值{% endblock %}
{% block form_title %}💳 模拟充值{% endblock %}
{% block form_desc %}模拟支付流程（仅记录，不到账）{% endblock %}

{% block form_content %}
<div class="form-group">
    <label for="uid" class="required">用户UID</label>
    <input type="text" id="uid" name="uid" placeholder="请输入9位用户UID" maxlength="9" required>
</div>
<div class="form-group">
    <label for="money" class="required">充值金额</label>
    <input type="text" id="money" name="money" placeholder="请输入充值金额" required>
</div>
{% endblock %}

{% block submit_text %}确认充值{% endblock %}
